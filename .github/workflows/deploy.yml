name: Deploy latest release

# Pull-based: this repository never receives pushes from the main repository.
# It downloads the sealed site bundle attached to the latest schema-letter
# release of arcaverborum/arcaverborum (public asset, no token needed),
# verifies its checksum and deploys it to GitHub Pages.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      deployed: ${{ steps.deployed.outputs.tag }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R arcaverborum/arcaverborum --exclude-pre-releases --exclude-drafts \
                --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName') || tag=
          [ -n "$tag" ] || echo "::notice::No release of arcaverborum/arcaverborum is visible yet; nothing to deploy."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: deployed
        run: |
          tag=$(curl -fsS https://arcaverborum.org/RELEASE 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.tag != '' && (github.event_name == 'workflow_dispatch' || needs.check.outputs.tag != needs.check.outputs.deployed)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download and verify the release site bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release download "$TAG" -R arcaverborum/arcaverborum -p "arcaverborum-$TAG-site.tar.gz" -p SHA256SUMS
          grep " arcaverborum-$TAG-site.tar.gz\$" SHA256SUMS | sha256sum -c -
          mkdir _site && tar -xzf "arcaverborum-$TAG-site.tar.gz" -C _site
          test -f _site/index.html && test -f _site/data/manifest.json
          echo "$TAG" > _site/RELEASE
          echo "arcaverborum.org" > _site/CNAME
          touch _site/.nojekyll
          du -sh _site
          size=$(du -sm _site | cut -f1); [ "$size" -lt 900 ] || { echo "::error::site is ${size} MB, above the 900 MB headroom"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
